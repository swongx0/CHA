<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
    <title>Contact</title>
  </head>
  <body>
    <header class="header">
      <nav class="nav container">
        <div class="menu__icon" id="menu-icon">
          <i class="ri-menu-fill"></i>
        </div>
        <div class="menu__close" id="menu-close">
          <i class="ri-close-line"></i>
        </div>
        <div class="nav__menu" id="nav-menu">
          <div class="nav__logo">
            <h1>CHA</h1>
          </div>
          <div class="nav__menu__list">
            <ul class="nav__list">
              <li class="nav__list-item">
                <a href="../index.html" class="nav__list-item-link">Home</a>
              </li>
              <li class="nav__list-item">
                <a href="about.html" class="nav__list-item-link">About</a>
              </li>
              <li class="nav__list-item">
                <a href="menu.html" class="nav__list-item-link">Menu</a>
              </li>
              <li class="nav__list-item">
                <a href="#" class="nav__list-item-link">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="contact__container">
        <div class="contact__title">
          <h1>Get in touch</h1>
        </div>
        <div class="contact__info">
          <div class="contact__info-left">
            <h3 class="contact__email">Email</h3>
            <p>info@cha.com</p>

            <h3 class="contact__email">Location</h3>
            <p>123 Address, State, Zip Code</p>

            <h3 class="contact__email">Connect with us on socials!</h3>

            <a href="" target="_blank" class="footer__social-link">
              <i class="ri-facebook-circle-fill"></i>
            </a>
            <a href="" target="_blank" class="footer__social-link">
              <i class="ri-instagram-fill"></i>
            </a>
            <a href="" target="_blank" class="footer__social-link">
              <i class="ri-twitter-fill"></i>
            </a>
          </div>
          <div class="contact__info-right">
            <h3 class="contact__email">Phone</h3>
            <p>+1 (510) 828-3619</p>
          </div>
        </div>
        <div class="contact__image">
          <img src="../assets/img/CHA contact.jpg" alt="" />
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="footer__container grid">
        <div class="footer__data">
          <div class="footer__logo">
            <h2>CHA</h2>
            <div class="footer__social-links">
              <a href="" target="_blank" class="footer__social-link">
                <i class="ri-facebook-circle-fill"></i>
              </a>
              <a href="" target="_blank" class="footer__social-link">
                <i class="ri-instagram-fill"></i>
              </a>
              <a href="" target="_blank" class="footer__social-link">
                <i class="ri-twitter-fill"></i>
              </a>
            </div>
          </div>
          <div class="menu__links">
            <div class="menu__left">
              <ul>
                <li><a href="">About</a></li>
                <li><a href="">Menu</a></li>
                <li><a href="">Contact Us</a></li>
              </ul>
            </div>
            <div class="menu__right">
              <ul>
                <li><a href="">Terms & Condition</a></li>
                <li><a href="">Privacy Policy</a></li>
              </ul>
            </div>
          </div>
        </div>
        <span class="footer__copy"
          >&#169; All Rights Reserved By Hatch Studios</span
        >
      </div>
    </footer>
    <script src="../assets/js/contact.js"></script>
  </body>
</html>
