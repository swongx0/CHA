<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <!--=============== REMIXICONS ===============-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>

    <title>CHA</title>
  </head>
  <body>
    <header class="header">
      <nav class="nav container">
        <div class="menu__icon" id="menu-icon">
          <i class="ri-menu-fill"></i>
        </div>
        <div class="menu__close" id="menu-close">
          <i class="ri-close-line"></i>
        </div>
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__list-item">
              <a href="#" class="nav__list-item-l ink">Home</a>
            </li>
            <li class="nav__list-item">
              <a href="./pages/about.html" class="nav__list-item-link">About</a>
            </li>
            <li class="nav__list-item">
              <a href="./pages/menu.html" class="nav__list-item-link">Menu</a>
            </li>
            <li class="nav__list-item">
              <a href="./pages/contact.html" class="nav__list-item-link"
                >Contact</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="main" id="smooth-wrapper">
      <div id="smooth-content">
        <!--==================== HERO ====================-->
        <section class="hero section">
          <div class="hero__container container grid">
            <div class="hero__data">
              <h1 class="hero__logo" data-speed="1.5">CHA</h1>
              <img
                src="./assets/img/5a4fe3e3957cda6443685d320460c125.jpg"
                alt="image"
                class="hero__img"
              />
            </div>
          </div>
        </section>

        <!--==================== QUOTE ====================-->
        <section class="quote section">
          <div class="quote__data">
            <h2 class="quote__title">
              Have A <br />Cup Of <br />
              CH
            </h2>
            <div class="quote__images" data-speed="1.5">
              <img
                src="./assets/img/pandan-latte.png"
                alt=""
                class="quote__img-1"
              />
              <img
                src="./assets/img/taro-boba.png"
                alt=""
                class="quote__img-2"
              />
              <img
                src="./assets/img/brown-sugar-boba.png"
                alt=""
                class="quote__img-3"
              />
            </div>
          </div>
        </section>

        <!--==================== GALLERY ====================-->
        <section class="gallery section">
          <div class="gallery__container grid">
            <div class="gallery__data">
              <div class="gallery__images">
                <img
                  src="./assets/img/CHA storefront.png"
                  alt=""
                  class="gallery__img-2"
                />
                <img src="./assets/img/ambiance-2.png" alt="" />

                <img
                  src="./assets/img/CHA branding.png"
                  alt=""
                  class="gallery__img-3"
                />

                <img src="./assets/img/CHA drink.jpg" alt="" />
                <img
                  src="./assets/img/CHA counter.jpg"
                  alt=""
                  class="gallery__img-1"
                />
                <img
                  src="./assets/img/CHA interior 2.jpg"
                  alt=""
                  class="gallery__img-4"
                />
              </div>
            </div>
          </div>
        </section>

        <!--==================== FOOTER ====================-->
        <footer class="footer">
          <div class="footer__container grid">
            <div class="footer__data">
              <div class="footer__logo">
                <h2>CHA</h2>
                <div class="footer__social-links">
                  <a href="" target="_blank" class="footer__social-link">
                    <i class="ri-facebook-circle-fill"></i>
                  </a>
                  <a href="" target="_blank" class="footer__social-link">
                    <i class="ri-instagram-fill"></i>
                  </a>
                  <a href="" target="_blank" class="footer__social-link">
                    <i class="ri-twitter-fill"></i>
                  </a>
                </div>
              </div>
              <div class="menu__links">
                <div class="menu__left">
                  <ul>
                    <li><a href="">About</a></li>
                    <li><a href="">Menu</a></li>
                    <li><a href="">Contact Us</a></li>
                  </ul>
                </div>
                <div class="menu__right">
                  <ul>
                    <li><a href="">Terms & Condition</a></li>
                    <li><a href="">Privacy Policy</a></li>
                  </ul>
                </div>
              </div>
            </div>
            <span class="footer__copy"
              >&#169; All Rights Reserved By Hatch Studios</span
            >
          </div>
        </footer>
      </div>
    </main>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
